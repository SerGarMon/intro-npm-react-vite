<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Introducción a React - Fundamentos</title>

  <!-- React y ReactDOM desde CDN (Sin dependencias locales/npm todavía) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone para transpilar JSX en tiempo real en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --react-blue: #61dafb;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .react-icon {
      animation: spin 20s linear infinite;
      width: 48px;
      height: 48px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      background: linear-gradient(to right, #61dafb, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      font-size: 1.35rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--react-blue);
    }

    .main-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.7;
      color: #e2e8f0;
      margin-bottom: 1.25rem;
      border-left: 4px solid var(--react-blue);
      padding-left: 1rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .tag {
      background-color: var(--badge-bg);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .feature-card {
      background-color: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.25rem;
    }

    .feature-card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #f1f5f9;
    }

    .feature-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .interactive-demo {
      text-align: center;
      padding: 1.5rem;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
      border: 1px dashed var(--card-border);
      margin-top: 1rem;
    }

    .btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin: 0.5rem;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .counter-display {
      font-size: 2rem;
      font-weight: bold;
      color: var(--react-blue);
      margin: 0.5rem 0;
    }

    .educational-notice {
      background-color: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: #fef08a;
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.9rem;
      margin-top: 1.5rem;
    }

    .educational-notice strong {
      color: #facc15;
    }
  </style>
</head>
<body>
  <!-- Contenedor raíz donde React montará la aplicación -->
  <div id="root" class="container"></div>

  <!-- Código React escrito con JSX -->
  <script type="text/babel">
    const { useState } = React;

    function Header() {
      return (
        <header>
          <div className="logo-container">
            <svg className="react-icon" viewBox="-11.5 -10.23174 23 20.46348">
              <circle cx="0" cy="0" r="2.05" fill="#61dafb"/>
              <g stroke="#61dafb" strokeWidth="1" fill="none">
                <ellipse rx="11" ry="4.2"/>
                <ellipse rx="11" ry="4.2" transform="rotate(60)"/>
                <ellipse rx="11" ry="4.2" transform="rotate(120)"/>
              </g>
            </svg>
            <h1>Introducción a React</h1>
          </div>
          <p className="subtitle">Proyecto Didáctico: Fase 1 (Un único archivo sin dependencias locales)</p>
        </header>
      );
    }

    function MainConcept() {
      return (
        <section className="card">
          <h2>📌 ¿Qué es React?</h2>
          
          <blockquote className="main-text">
            Esto es <strong>React</strong>. Aunque ellos se autodenominan librería de renderizado, 
            en clase lo consideraremos un <strong>framework</strong>. Es de los frameworks de JavaScript 
            más populares en desarrollo web, aunque tiene opciones para multiplataforma. 
            Consiste en un <strong>motor de renderizado</strong> que da una experiencia muy fluida al usuario.
          </blockquote>

          <div className="tags">
            <span className="tag">En clase: Framework</span>
            <span className="tag">Oficial: Librería de Renderizado</span>
            <span className="tag">Multiplataforma</span>
            <span className="tag">UI Fluida y Reactiva</span>
          </div>
        </section>
      );
    }

    function ConceptDetails() {
      return (
        <div className="grid">
          <div className="feature-card">
            <h3>🧩 Librería vs Framework</h3>
            <p>
              Aunque React solo se encarga de pintar la vista (interfaz), el ecosistema que lo rodea
              y la forma en que estructura una aplicación moderna hacen que en nuestro curso lo tratemos
              y estudiemos como un framework completo.
            </p>
          </div>

          <div className="feature-card">
            <h3>📱 Opciones Multiplataforma</h3>
            <p>
              La misma filosofía («aprende una vez, escribe donde sea») permite crear apps móviles con 
              <strong> React Native</strong> o interfaces para escritorio, compartiendo la misma lógica de componentes.
            </p>
          </div>
        </div>
      );
    }

    function FluidExperienceDemo() {
      const [clicks, setClicks] = useState(0);

      return (
        <section className="card">
          <h2>⚡ ¿Por qué da una experiencia fluida?</h2>
          <p style={{ color: "var(--text-muted)", marginBottom: "1rem" }}>
            React utiliza un <em>Virtual DOM</em> y un motor reactivo. En lugar de recargar la página entera,
            solo actualiza en pantalla el elemento exacto que cambia.
          </p>

          <div className="interactive-demo">
            <p>Prueba de reactividad instantánea:</p>
            <div className="counter-display">{clicks}</div>
            <button className="btn" onClick={() => setClicks(clicks + 1)}>
              ¡Haz clic para interactuar!
            </button>
            <button 
              className="btn" 
              style={{ background: "#475569", color: "#f8fafc" }}
              onClick={() => setClicks(0)}
            >
              Reiniciar
            </button>
            <p style={{ fontSize: "0.85rem", color: "var(--text-muted)", marginTop: "0.5rem" }}>
              Observa cómo cambia el número sin recargar el navegador ni parpadear la página.
            </p>
          </div>
        </section>
      );
    }

    function PedagogicalRoadmap() {
      return (
        <div className="educational-notice">
          <strong>🎓 Nota de Clase & Hoja de Ruta:</strong>
          <ul style={{ marginTop: "0.5rem", marginLeft: "1.25rem", lineHeight: "1.6" }}>
            <li>
              <strong>Fase actual:</strong> Todo el proyecto está contenido en este único archivo <code>index.html</code> usando CDN. No requiere instalar nada ni tener <code>node_modules</code>.
            </li>
            <li>
              <strong>Próximos pasos en clase:</strong> Descubriremos qué es <strong>NPM</strong> (Node Package Manager), crearemos un <code>package.json</code> y aprenderemos a instalar componentes y librerías externas de forma profesional.
            </li>
          </ul>
        </div>
      );
    }

    function App() {
      return (
        <div>
          <Header />
          <MainConcept />
          <ConceptDetails />
          <FluidExperienceDemo />
          <PedagogicalRoadmap />
        </div>
      );
    }

    // Montar la aplicación en el DOM
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
